<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>تسجيل الدخول — CAPITAL RISE</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="f" autocomplete="on">
    <h1>CAPITAL RISE</h1>
    <p class="sub">لوحة التحكم — تسجيل الدخول</p>
    <label class="f" for="u">اسم المستخدم</label>
    <input class="inp" id="u" name="username" autocomplete="username" required autofocus>
    <label class="f" for="p">كلمة المرور</label>
    <input class="inp" id="p" name="password" type="password" autocomplete="current-password" required>
    <div class="err" id="err" role="alert"></div>
    <button class="btn primary block" id="go" type="submit">دخول</button>
  </form>
</div>
<script src="/admin/assets/login.js"></script>
</body>
</html>
