const R={
 services:()=>`${head('services')}<div class="grid2" data-stagger>${S.services.filter(s=>s.on).map(s=>`<article class="svc"><div class="ico">${s.img?`<img src="${esc(s.img)}" alt="">`:`<svg><use href="#${esc(s.icon)}"/></svg>`}</div><div><h3>${esc(s.title)}</h3><p>${esc(s.desc)}</p><a class="go" href="${esc(waLink('أرغب في طلب خدمة: '+s.title))}" target="_blank" rel="noopener">${esc(s.cta)}</a></div></article>`).join('')}</div>`,
 how:()=>`${head('how')}<div class="steps rv">${S.steps.map((s,i)=>`<div><div class="n">${i+1}</div><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p></div>`).join('')}</div>`,
 why:()=>`${head('why')}<div class="why" data-stagger>${S.why.map(w=>`<div><svg><use href="#ck"/></svg><span>${esc(w)}</span></div>`).join('')}</div>`,
 portfolio:()=>`${head('portfolio')}<div class="pf" data-stagger>${S.portfolio.filter(p=>p.on).map(p=>`<article class="pc"><div class="im">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.title)}" loading="lazy">`:''}</div><div class="bd">${p.category?`<span class="tag">${esc(p.category)}</span>`:''}${p.status?`<span class="tag">${esc(p.status)}</span>`:''}<h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p></div></article>`).join('')}</div>`,
 testimonials:()=>`${head('testimonials')}<div class="tm" data-stagger>${S.testimonials.filter(t=>t.on).map(t=>`<div class="tq"><q>${esc(t.quote)}</q><div class="who">${t.img?`<img src="${esc(t.img)}" alt="">`:`<i>${esc((t.name||'؟')[0])}</i>`}<span>${esc(t.name)}<small>${esc(t.position)}</small></span></div></div>`).join('')}</div>`,
 certificates:()=>`${head('certificates')}<div class="cert-grid" data-stagger>${S.certificates.filter(c=>c.on).map(c=>`<article class="cert-card"><div class="cert-img">${c.img?`<img src="${esc(c.img)}" alt="${esc(c.title)}" loading="lazy">`:`<div class="cert-placeholder" aria-hidden="true">✦</div>`}</div><div class="cert-bd"><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p></div></article>`).join('')}</div>`
};
let io,so,quiet=false;
function build(){const h=$('#h1');if(!h)return;h.setAttribute('aria-label',S.hero.title);if(S.anim.hero==='word')h.innerHTML=S.hero.title.split(' ').map((w,i)=>`<span class="w" aria-hidden="true" style="--i:${i}">${esc(w)}</span>`).join(' ')}
function renderSite(q){
 quiet=!!q;H.classList.toggle('quiet',quiet);
 const t=S.theme,r=H.style,a=S.anim,c=S.contact;
 r.setProperty('--gold',t.primary);r.setProperty('--emerald',t.secondary);r.setProperty('--gold2',t.accent);r.setProperty('--bg',t.bg);r.setProperty('--text',t.text);r.setProperty('--btn',t.btn);
 r.setProperty('--dur',{fast:'.5s',normal:'.85s',slow:'1.3s'}[a.speed]);
 Object.assign(H.dataset,{hover:a.hover,reveal:a.reveal,intensity:a.intensity,logo:a.logo,bg:a.bg,hero:a.hero,off:a.off?'1':'0'});
 document.title=tr(S.brand.title);let m=document.querySelector('meta[name=description]');m.content=tr(S.brand.desc);
 let f=document.querySelector('link[rel=icon]');if(!f){f=document.createElement('link');f.rel='icon';document.head.appendChild(f)}f.href=S.brand.fav||logo();
 const shown=S.order.filter(k=>S.sec[k].on&&has(k));
 $('#hdr').innerHTML=`<a class="brand" href="#top"><img src="${esc(logo())}" alt="" width="44" height="44"><span>${esc(S.brand.name)}</span></a><ul class="links">${shown.map(k=>`<li><a href="#${k}">${esc(S.sec[k].nav)}</a></li>`).join('')}${S.cta.on?'<li><a href="#contact">تواصل معنا</a></li>':''}</ul><div style="display:flex;align-items:center;gap:10px"><button class="lang-btn" id="langToggle" type="button" aria-label="${LANG==='ar'?'Switch to English':'التبديل للعربية'}">🌐 ${LANG==='ar'?'EN':'AR'}</button><a class="btn btn-p" href="${esc(waLink())}" target="_blank" rel="noopener">${esc(S.hero.b1)}</a></div>`;
 document.getElementById('langToggle')?.addEventListener('click',()=>setLang(LANG==='ar'?'en':'ar'));
 $('#hero').innerHTML=`<div class="blob b1"></div><div class="blob b2"></div><div class="wrap hero-grid"><div><h1 id="h1">${esc(S.hero.title)}</h1><p class="lead">${esc(S.hero.lead)}</p><div class="acts"><a class="btn btn-p mag" href="${esc(waLink())}" target="_blank" rel="noopener">${esc(S.hero.b1)}</a><a class="btn btn-g" href="#${shown[0]||'top'}">${esc(S.hero.b2)}</a></div></div><div class="logo-stage"><div class="halo"></div><div class="ring"></div><img id="heroLogo" class="${S.hero.img?'photo':''}" src="${esc(S.hero.img||logo())}" alt="${esc(S.brand.name)}"></div></div>`;
 build();
 const chips=[c.phone&&`<a href="tel:${esc(c.phone.replace(/[^\d+]/g,''))}">${esc(c.phone)}</a>`,c.whatsapp&&`<a href="${esc(waLink())}" target="_blank" rel="noopener">واتساب</a>`,c.email&&`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`,c.address&&`<span>${esc(c.address)}</span>`,c.hours&&`<span>${esc(c.hours)}</span>`].filter(Boolean).join('');
 $('#secs').innerHTML=shown.map((k,i)=>`<section id="${k}" class="${i%2?'alt':''}"><div class="wrap">${R[k]()}</div></section>`).join('')+(S.cta.on?`<section class="cta" id="contact"><div class="wrap"><h2 class="rv">${esc(S.cta.title)}</h2><p class="rv">${esc(S.cta.desc)}</p><a class="btn btn-p mag rv" href="${esc(link())}" target="_blank" rel="noopener">${esc(S.cta.btn)}</a>${chips?`<div class="chips rv">${chips}</div>`:''}</div></section>`:'');
 const soc=S.socials.filter(x=>x.on&&x.url).map(x=>`<a class="social-icon" href="${esc(socialUrl(x))}" rel="noopener" target="_blank" aria-label="${esc(x.name)}" title="${esc(x.name)}"><svg viewBox="0 0 24 24">${socialIcon(x.icon)}</svg><span class="social-label">${esc(x.name)}</span></a>`).join('');
 const contactSocials=soc?`<div class="contact-socials rv"><h3>تابعنا وتواصل معنا</h3><div class="social-icons">${soc}</div></div>`:'';
 $('#secs').querySelector('#contact .wrap').insertAdjacentHTML('beforeend',contactSocials);
 $('#ftr').innerHTML=`<div class="foot"><div><a class="brand" href="#top"><img src="${esc(logo())}" alt="" width="44" height="44"><span>${esc(S.brand.name)}</span></a><div style="margin-top:8px">${esc(S.brand.tag)}</div></div>${soc?`<div class="soc">${soc}</div>`:''}<span>© ${esc(S.brand.name)}</span></div>`;
 document.querySelectorAll('[data-stagger]').forEach(p=>[...p.children].forEach((ch,i)=>{ch.classList.add('rv');ch.style.setProperty('--d',i*90+'ms')}));
 io&&io.disconnect();so&&so.disconnect();
 io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;el.classList.add('in');el.addEventListener('transitionend',ev=>{if(ev.propertyName==='transform')el.style.setProperty('--d','0ms')},{once:true});io.unobserve(el)}),{threshold:.12});
 document.querySelectorAll('.rv').forEach(el=>quiet?el.classList.add('in'):io.observe(el));
 const ls=[...document.querySelectorAll('.links a')];
 so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)ls.forEach(l=>l.classList.toggle('on',l.getAttribute('href')==='#'+e.target.id))}),{rootMargin:'-45% 0px -50% 0px'});
 document.querySelectorAll('#secs section').forEach(s=>so.observe(s));
}
/* magnetic buttons + cursor glow */
const fine=matchMedia('(pointer:fine)').matches,cur=$('#cur');
document.addEventListener('pointermove',e=>{
 if(fine&&S.anim.cursor&&!S.anim.off){cur.style.opacity=1;cur.style.transform=`translate3d(${e.clientX}px,${e.clientY}px,0)`}else cur.style.opacity=0;
 const b=e.target.closest&&e.target.closest('.mag');if(b&&fine&&S.anim.mag&&!S.anim.off){const r=b.getBoundingClientRect();b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.22}px,${(e.clientY-r.top-r.height/2)*.3}px)`}});
document.addEventListener('pointerout',e=>{const b=e.target.closest&&e.target.closest('.mag');if(b)b.style.transform=''});
H.lang=LANG;H.dir=LANG==='en'?'ltr':'rtl';
fetch('/api/public',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(data=>{S=merge(clone(D),data||{});renderSite(0)}).catch(()=>renderSite(0));
</script>
</body>
</html>
